name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  server-tests:
    name: Server Gateway Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'server/serverpush/go/go.mod'
          cache-dependency-path: |
            server/serverpush/go/go.sum
            server/serverapi/go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Run Server Gateway Tests
        run: make test-server

  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    needs: server-tests
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Android SDK path
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode Release Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Assemble Production Release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make build-release

      - name: Clean up Release Keystore
        if: always()
        run: rm -f release.jks

      - name: Assemble Testkey Release APK
        run: make build-release-testkey

      - name: Prepare Release Artifacts & Checksums
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"

          # Copy & rename Production Release APK
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/remote-bot-android_${TAG}.apk"

          # Copy & rename Testkey Release APK
          cp app/build/outputs/apk/releaseTestkey/app-releaseTestkey.apk "release-artifacts/remote-bot-android_${TAG}_testkey.apk"

          # Calculate SHA-256 Checksums
          cd release-artifacts
          sha256sum "remote-bot-android_${TAG}.apk" > "remote-bot-android_${TAG}.apk.sha256"
          sha256sum "remote-bot-android_${TAG}_testkey.apk" > "remote-bot-android_${TAG}_testkey.apk.sha256"

          echo "=== Release Artifacts ==="
          ls -lh
          echo "=== Checksums ==="
          cat *.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

