name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ============================================================================
  # 1. Validate Gradle Wrapper checksum (supply-chain attack protection)
  # ============================================================================
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

  # ============================================================================
  # 1.1 Detect changed paths for conditional job execution in PRs
  # ============================================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for server file changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'

  # ============================================================================
  # 2. Static analysis and linters (ktlint, detekt, Android Lint)
  # ============================================================================
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    needs: wrapper-validation
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Configure Android SDK path
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run ktlint check
        run: make lint-ktlint

      - name: Run detekt static analysis
        run: make lint-detekt

      - name: Run Android Lint (debug)
        run: make lint-android

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results*
            */build/reports/detekt/
            */build/reports/ktlint/
          retention-days: 7

  # ============================================================================
  # 3. Android & Kotlin Domain unit testing
  # ============================================================================
  unit-tests:
    name: Unit Tests (Android & Domain)
    runs-on: ubuntu-latest
    needs: wrapper-validation
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Configure Android SDK path
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run Unit Tests & Coverage Report
        run: make test-coverage

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-and-coverage-reports
          path: |
            */build/reports/tests/
            */build/test-results/
            domain/build/reports/jacoco/
          retention-days: 7

  # ============================================================================
  # 4. Build APKs (Debug and Release)
  # ============================================================================
  build-apk:
    name: Build APK (Debug & Release)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Configure Android SDK path
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble Debug APK
        run: make build-debug

      - name: Decode Release Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Assemble Release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: make build-release

      - name: Clean up Release Keystore
        if: always()
        run: rm -f release.jks

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14

  # ============================================================================
  # 5. Server gateway testing (Go, Python, Cloudflare Workers)
  # ============================================================================
  server-tests:
    name: Server Gateway Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'server/serverpush/go/go.mod'
          cache-dependency-path: |
            server/serverpush/go/go.sum
            server/serverapi/go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      # Server Gateway Tests
      - name: Run Server Gateway Tests
        run: make test-server
