version: 2
updates:
  # 1. Android & Gradle (libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # AGP 9+ requires experimental Android SDK 36/37 and breaks Huawei AGC plugin
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      # Gradle 9+ requires AGP 9+
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      # Compose BOM > 2025.11.01 includes Compose UI 1.10+ (requires compileSdk 36+ and AGP 9.1+)
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">= 2025.12.00"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">= 1.16.0"]
    groups:
      compose:
        patterns:
          - "androidx.compose*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"

  # 2. GitHub Actions workflows (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "actions/*"
          - "docker/*"


  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/server"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
