# Nginx / OpenResty configuration for Push Gateway
# Requires lua-nginx-module (or OpenResty) to run gateway.lua

# Allow passing environment variables to Nginx workers
env PUSH_GATEWAY_SECRET;
env FIREBASE_SERVICE_ACCOUNT;
env HUAWEI_APP_ID;
env HUAWEI_CLIENT_ID;
env HUAWEI_CLIENT_SECRET;

# Allocate shared memory for caching Google / Huawei OAuth tokens
lua_shared_dict push_token_cache 10m;

# Path to lua packages (resty.http, resty.jwt, etc.)
lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/share/lua/5.1/?.lua;;";
lua_package_cpath "/usr/local/openresty/lualib/?.so;/usr/local/lib/lua/5.1/?.so;;";

# Enable DNS resolver for oauth2.googleapis.com and push-api.cloud.huawei.com
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name push.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name push.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/push.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Trusted root certificates for outbound SSL requests to Google/Huawei API
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 3;

    # Push Gateway route handling
    location / {
        default_type application/json;
        content_by_lua_file /etc/nginx/remotebot/gateway.lua;
    }
}

