# Nginx / OpenResty конфигурация для Push Gateway
# Требует модуль lua-nginx-module (или OpenResty) для работы gateway.lua

# Разрешаем передачу переменных окружения в воркеры Nginx
env PUSH_GATEWAY_SECRET;
env FIREBASE_SERVICE_ACCOUNT;
env HUAWEI_APP_ID;
env HUAWEI_CLIENT_ID;
env HUAWEI_CLIENT_SECRET;

# Выделяем разделяемую память для кэширования OAuth токенов Google / Huawei
lua_shared_dict push_token_cache 10m;

# Путь к lua-пакетам (resty.http, resty.jwt и т.д.)
lua_package_path "/usr/local/openresty/lualib/?.lua;/usr/local/share/lua/5.1/?.lua;;";
lua_package_cpath "/usr/local/openresty/lualib/?.so;/usr/local/lib/lua/5.1/?.so;;";

# Включаем резолвер DNS для обращений к oauth2.googleapis.com и push-api.cloud.huawei.com
resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name push.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name push.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/push.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Доверенные корневые сертификаты для исходящих SSL-запросов к Google/Huawei API
    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 3;

    # Обработка Push Gateway маршрутов
    location / {
        default_type application/json;
        content_by_lua_file /etc/nginx/remotebot/gateway.lua;
    }
}

