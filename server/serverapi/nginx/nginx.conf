# Nginx Reverse Proxy конфигурация для Telegram Bot API
#
# Позволяет полностью обойтись без запуска Go, Python или Node.js процессов:
# Nginx сам принимает входящие запросы по HTTPS и проксирует их на api.telegram.org:443.

server {
    listen 80;
    server_name tg-api.yourdomain.com;

    # Автоматический редирект HTTP -> HTTPS (рекомендуется)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tg-api.yourdomain.com;

    # SSL сертификаты (например, от Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/tg-api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg-api.yourdomain.com/privkey.pem;

    # Оптимальные параметры TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Максимальный размер загружаемого файла (для команд /photo, /file, отправки видео и логов)
    client_max_body_size 50M;

    # Таймауты для Long Polling (getUpdates держит соединение до 30-50 секунд)
    proxy_connect_timeout 60s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # Настройка резолвера DNS для динамического резолвинга api.telegram.org
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        # Целевой адрес Telegram Bot API
        proxy_pass https://api.telegram.org;

        # Подмена Host заголовка и SNI для успешного TLS-рукопожатия с серверами Telegram
        proxy_set_header Host api.telegram.org;
        proxy_ssl_server_name on;
        proxy_ssl_name api.telegram.org;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Передача реальных клиентских заголовков
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключение буферизации для мгновенной доставки стриминга ответов
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }
}

