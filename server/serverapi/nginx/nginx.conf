# Nginx Reverse Proxy configuration for Telegram Bot API
#
# Allows running without starting Go, Python, or Node.js processes:
# Nginx accepts incoming HTTPS requests and proxies them to api.telegram.org:443.

server {
    listen 80;
    server_name tg-api.yourdomain.com;

    # Automatic redirect HTTP -> HTTPS (recommended)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tg-api.yourdomain.com;

    # SSL certificates (e.g. from Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/tg-api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg-api.yourdomain.com/privkey.pem;

    # Optimal TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Maximum client upload file size (for /photo, /file, video, and logs)
    client_max_body_size 50M;

    # Timeouts for Long Polling (getUpdates holds connection up to 30-50 seconds)
    proxy_connect_timeout 60s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # DNS resolver configuration for dynamic api.telegram.org resolution
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location / {
        # Target Telegram Bot API address
        proxy_pass https://api.telegram.org;

        # Rewrite Host header and SNI for successful TLS handshake with Telegram servers
        proxy_set_header Host api.telegram.org;
        proxy_ssl_server_name on;
        proxy_ssl_name api.telegram.org;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # Forward real client headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for immediate response stream delivery
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
    }
}

